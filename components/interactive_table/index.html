<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Signals Table</title>
<style>
  :root {
    --bg-color: #0e1117;
    --card-bg: #151922;
    --row-alt: #181d27;
    --head-bg: #1b2130;
    --border-color: #2b313e;
    --divider: #39414f;
    --text-primary: #e8ebf0;
    --text-muted: #8b949e;
    --text-faint: #4d5562;
    --hover-bg: #232b3b;
    --active-bg: rgba(33, 150, 243, 0.20);
    --active-border: #2196f3;
    --pos: #5fd38d;
    --neg: #ff7b72;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: var(--font-stack);
    font-size: 13px;
    line-height: 1.4;
    overflow-x: hidden;
    padding: 2px 2px 8px 2px;
  }

  .table-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 7px 12px;
    width: 320px;
    max-width: 100%;
    transition: border-color 0.2s ease;
  }
  .search-box:focus-within { border-color: var(--active-border); }
  .search-box input {
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .legend { display: flex; gap: 10px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .table-container {
    border: 1px solid var(--border-color);
    border-radius: 10px;
    max-height: 820px;
    overflow: auto;
    background: var(--card-bg);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
  }
  .table-container::-webkit-scrollbar { width: 9px; height: 9px; }
  .table-container::-webkit-scrollbar-track { background: #12151c; }
  .table-container::-webkit-scrollbar-thumb { background: #2b313e; border-radius: 5px; }
  .table-container::-webkit-scrollbar-thumb:hover { background: #3d4659; }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--head-bg);
    padding: 10px 10px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--divider);
    transition: color 0.15s ease;
    text-align: left;
  }
  thead th.num { text-align: right; }
  thead th:hover { color: var(--text-primary); }
  thead th.sorted { color: var(--text-primary); }
  th.sorted-asc::after { content: " ▲"; font-size: 9px; color: var(--active-border); }
  th.sorted-desc::after { content: " ▼"; font-size: 9px; color: var(--active-border); }

  /* group separators: identity | score | components | sector */
  .sep-left { border-left: 1px solid var(--divider); }

  tbody tr { cursor: pointer; transition: background-color 0.12s ease; }
  tbody tr:nth-child(even) td { background: var(--row-alt); }
  tbody tr:hover td { background: var(--hover-bg) !important; }
  tbody tr.selected td { background: var(--active-bg) !important; }
  tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--active-border); }
  tbody tr.dim td { opacity: 0.5; }

  td {
    padding: 9px 10px;
    font-size: 12.5px;
    vertical-align: middle;
    border-bottom: 1px solid rgba(43, 49, 62, 0.55);
  }
  td.num { text-align: right; }

  .col-symbol { font-weight: 700; color: #64b5f6; }
  .col-name { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .col-sector { color: var(--text-muted); max-width: 170px; overflow: hidden; text-overflow: ellipsis; }

  .pts-pos { color: var(--pos); font-weight: 600; }
  .pts-neg { color: var(--neg); font-weight: 600; }
  .pts-zero { color: var(--text-faint); }

  .badge-score {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 12px;
    text-align: center;
    min-width: 38px;
  }
  .score-high { background: rgba(0, 200, 83, 0.18); color: #5fd38d; border: 1px solid rgba(0, 200, 83, 0.45); }
  .score-med  { background: rgba(255, 179, 0, 0.16); color: #ffc233; border: 1px solid rgba(255, 179, 0, 0.42); }
  .score-low  { background: rgba(139, 148, 158, 0.13); color: #abb2bf; border: 1px solid rgba(139, 148, 158, 0.28); }

  .rank-score { font-weight: 700; color: var(--text-primary); }
  .status-icon { margin-left: 5px; font-size: 11px; color: var(--text-muted); }

  .empty-state { padding: 40px; text-align: center; color: var(--text-muted); }
</style>
</head>
<body>

<div class="table-toolbar">
  <div class="search-box">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 7px; opacity: 0.7;">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="searchInput" placeholder="Suchen: Symbol, Name oder Sektor …" autocomplete="off">
  </div>
  <div class="toolbar-right">
    <div class="legend" title="Farbstufen des Punkte-Scores (Maximum 90 Punkte)">
      <span>Punkte-Score:</span>
      <span><i class="dot" style="background:#5fd38d"></i>ab 50</span>
      <span><i class="dot" style="background:#ffc233"></i>35–49</span>
      <span><i class="dot" style="background:#abb2bf"></i>unter 35</span>
    </div>
    <div id="tableStats">0 Werte geladen</div>
  </div>
</div>

<div class="table-container" id="tableContainer">
  <table id="signalsTable">
    <thead>
      <tr id="tableHeader"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  let rawRows = [];
  let currentFilteredRows = [];
  let selectedSymbol = null;
  let sortColumn = "Rang-Score";
  let sortAscending = false;

  // kind: text | rank | score | plain | points | signed
  const COLUMNS = [
    { key: "Symbol", label: "Symbol", kind: "text", class: "col-symbol" },
    { key: "Name", label: "Name", kind: "text", class: "col-name" },
    { key: "Sektor", label: "Sektor", kind: "text", class: "col-sector" },
    { key: "Rang-Score", label: "Rang-Score", kind: "rank", sep: true, tip: "Rang aus 6 Bausteinen, 0 bis 100: besser als so viel Prozent der Vergleichsaktien" },
    { key: "Punkte-Score", label: "Punkte-Score", kind: "score", tip: "Summe fester Punkte aus 11 Signalen (max. 90)" },
    { key: "EPS", label: "EPS", kind: "points", sep: true, tip: "EPS-Revisionen (max. 15)" },
    { key: "Kursziel", label: "Kursziel", kind: "points", tip: "Kursziele & Konsens (max. 5)" },
    { key: "P/V", label: "P/V", kind: "points", tip: "Preis/Volumen (max. 5)" },
    { key: "News", label: "News", kind: "points", tip: "News-Sentiment (max. 15)" },
    { key: "Event", label: "Event", kind: "points", tip: "Event-Druck (max. 5)" },
    { key: "Insider", label: "Insider", kind: "points", tip: "Insider-Aktivität (max. 10)" },
    { key: "Short", label: "Short", kind: "points", tip: "Short Interest (max. 5)" },
    { key: "Rel.St.", label: "Rel.St.", kind: "points", tip: "Relative Stärke (max. 5)" },
    { key: "Fundam.", label: "Fundam.", kind: "points", tip: "Fundamentale Bewertung (max. 15)" },
    { key: "Tech.", label: "Tech.", kind: "points", tip: "Technische Indikatoren (max. 5)" },
    { key: "Rückkauf", label: "Rückkauf", kind: "points", tip: "Aktienrückkauf (max. 5)" },
    { key: "Vs. Sektor", label: "Vs. Sektor", kind: "signed", sep: true, tip: "Abstand zum Sektor-Durchschnitt der Watchlist" },
    { key: "Rang", label: "Rang", kind: "text", tip: "Rang innerhalb des Sektors" }
  ];

  const isNumeric = col => col.kind !== "text";

  function sendValueToStreamlit(value) {
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value: value }, "*");
  }

  function setFrameHeight(height) {
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: height }, "*");
  }

  function notifyReady() {
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
  }

  function renderHeader() {
    const headerRow = document.getElementById("tableHeader");
    headerRow.innerHTML = "";
    COLUMNS.forEach(col => {
      const th = document.createElement("th");
      th.textContent = col.label;
      if (col.tip) th.title = col.tip;
      if (isNumeric(col)) th.classList.add("num");
      if (col.sep) th.classList.add("sep-left");
      if (col.key === sortColumn) {
        th.classList.add("sorted", sortAscending ? "sorted-asc" : "sorted-desc");
      }
      th.addEventListener("click", () => {
        if (sortColumn === col.key) {
          sortAscending = !sortAscending;
        } else {
          sortColumn = col.key;
          sortAscending = (col.kind === "text");
        }
        applySortAndRender();
      });
      headerRow.appendChild(th);
    });
  }

  function getScoreClass(val) {
    if (val >= 50) return "score-high";
    if (val >= 35) return "score-med";
    return "score-low";
  }

  function fillCell(td, col, val, row) {
    if (val === undefined || val === null || val === "") {
      td.textContent = "–";
      td.classList.add("pts-zero");
      return;
    }
    if (col.kind === "rank" && typeof val === "number") {
      td.textContent = val.toFixed(1);
      td.classList.add("rank-score");
      return;
    }
    if (col.kind === "score" && typeof val === "number") {
      const badge = document.createElement("span");
      badge.className = `badge-score ${getScoreClass(val)}`;
      badge.textContent = val;
      td.appendChild(badge);
      if (row._status) {
        const icon = document.createElement("span");
        icon.className = "status-icon";
        icon.textContent = row._status === "stale" ? "⏱" : "⚠";
        icon.title = row._hint || "";
        td.appendChild(icon);
      }
      return;
    }
    if ((col.kind === "points" || col.kind === "signed") && typeof val === "number") {
      if (val > 0) {
        td.textContent = "+" + val;
        td.classList.add("pts-pos");
      } else if (val < 0) {
        td.textContent = "−" + Math.abs(val);
        td.classList.add("pts-neg");
      } else {
        td.textContent = col.kind === "points" ? "·" : "0";
        td.classList.add("pts-zero");
      }
      return;
    }
    td.textContent = val;
    if (col.class === "col-name" || col.class === "col-sector") td.title = val;
  }

  function renderBody() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    if (currentFilteredRows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${COLUMNS.length}" class="empty-state">Keine passenden Aktien gefunden.</td></tr>`;
    }

    currentFilteredRows.forEach(row => {
      const tr = document.createElement("tr");
      if (selectedSymbol && row["Symbol"] === selectedSymbol) tr.classList.add("selected");
      if (row._status) {
        tr.classList.add("dim");
        tr.title = row._hint || "";
      }

      tr.addEventListener("click", () => {
        selectedSymbol = row["Symbol"];
        document.querySelectorAll("#tableBody tr").forEach(el => el.classList.remove("selected"));
        tr.classList.add("selected");
        sendValueToStreamlit(row["Symbol"]);
      });

      COLUMNS.forEach(col => {
        const td = document.createElement("td");
        if (col.class) td.classList.add(col.class);
        if (isNumeric(col)) td.classList.add("num");
        if (col.sep) td.classList.add("sep-left");
        fillCell(td, col, row[col.key], row);
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

    const stats = document.getElementById("tableStats");
    stats.textContent = `${currentFilteredRows.length} von ${rawRows.length} Werten`;
  }

  function applySortAndRender() {
    currentFilteredRows.sort((a, b) => {
      let valA = a[sortColumn];
      let valB = b[sortColumn];
      const numeric = COLUMNS.some(col => col.key === sortColumn && isNumeric(col));
      const empty = numeric ? (sortAscending ? Infinity : -Infinity) : "";  // missing values always last
      if (valA === undefined || valA === null) valA = empty;
      if (valB === undefined || valB === null) valB = empty;
      if (typeof valA === "number" && typeof valB === "number") {
        return sortAscending ? valA - valB : valB - valA;
      }
      return sortAscending
        ? String(valA).localeCompare(String(valB))
        : String(valB).localeCompare(String(valA));
    });
    renderHeader();
    renderBody();
  }

  function applyFilter() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    if (!q) {
      currentFilteredRows = [...rawRows];
    } else {
      currentFilteredRows = rawRows.filter(r => {
        const sym = String(r["Symbol"] || "").toLowerCase();
        const name = String(r["Name"] || "").toLowerCase();
        const sector = String(r["Sektor"] || "").toLowerCase();
        return sym.includes(q) || name.includes(q) || sector.includes(q);
      });
    }
    applySortAndRender();
  }

  document.getElementById("searchInput").addEventListener("input", applyFilter);

  const FRAME_HEIGHT = 880;

  window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "streamlit:render") {
      const args = event.data.args || {};
      rawRows = args.rows || [];
      if (args.selected_symbol) selectedSymbol = args.selected_symbol;
      applyFilter();
      setFrameHeight(Math.min(Math.max(document.body.scrollHeight, 250), FRAME_HEIGHT));
    }
  });

  notifyReady();
  setTimeout(() => { setFrameHeight(FRAME_HEIGHT); }, 100);
</script>
</body>
</html>
