name: Weekly System Check

# Sundays, when no nightly run is due: all unit tests with freshly installed libraries, then a live
# check of every external connection, last week's runs and the app (system_check.py).
# A failure fails the run (GitHub mails the owner) and opens or updates an issue with the report.
on:
  schedule:
    - cron: '0 10 * * 0'   # Sundays 10:00 UTC, after a possible Saturday backup run
  workflow_dispatch:

concurrency:
  group: weekly-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies (newest versions, like the nightly run)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Unit tests
      id: unit
      continue-on-error: true
      run: |
        set -o pipefail
        python -m pytest tests/ -q -p no:cacheprovider 2>&1 | tee unit_tests.log

    - name: Live check of every connection
      id: live
      continue-on-error: true
      env:
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: python system_check.py --report system_check_report.md

    - name: Open or update the issue on failure
      if: steps.unit.outcome == 'failure' || steps.live.outcome == 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        {
          echo "Der Wochencheck vom $(date -u '+%d.%m.%Y') ist fehlgeschlagen. Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo
          echo "**Unit-Tests:** ${{ steps.unit.outcome }}"
          if [ "${{ steps.unit.outcome }}" = "failure" ]; then
            echo
            echo '```'
            grep -E "FAILED|ERROR|passed|failed" unit_tests.log | tail -30
            echo '```'
          fi
          echo
          if [ -f system_check_report.md ]; then cat system_check_report.md; else echo "Der Live-Check lief nicht bis zum Bericht."; fi
        } > issue_body.md
        gh label create wochencheck --color B60205 --description "Fehler im Wochencheck" --force
        number=$(gh issue list --label wochencheck --state open --json number --jq '.[0].number')
        if [ -n "$number" ]; then
          gh issue comment "$number" --body-file issue_body.md
        else
          gh issue create --title "Wochencheck fehlgeschlagen" --label wochencheck --body-file issue_body.md
        fi

    - name: Fail the run when a check failed
      if: steps.unit.outcome == 'failure' || steps.live.outcome == 'failure'
      run: exit 1
