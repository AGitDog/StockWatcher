name: Update Stock Signals

# Yahoo blocks a run after roughly 350 symbols, so the watchlist runs in four region groups,
# each after its exchanges closed (times in UTC; German time is UTC+1 in winter, UTC+2 in summer).
# Every run merges its group into the same daily snapshot.
on:
  schedule:
    - cron: '0 8 * * *'     # asia      (Tokyo/Mumbai closed)
    - cron: '30 17 * * *'   # europe    (Xetra/London closed)
    - cron: '30 21 * * *'   # america-1 (New York closed)
    - cron: '30 22 * * *'   # america-2
  workflow_dispatch:
    inputs:
      group:
        description: 'Gruppe (all laedt alles auf einmal und wird von Yahoo nach ~350 Titeln gebremst)'
        required: true
        default: 'asia'
        type: choice
        options: [asia, europe, america-1, america-2, all]
      run_bot:
        description: 'Paper-Bot danach ausfuehren (laeuft sonst nur nach america-2)'
        required: false
        default: false
        type: boolean

# Runs never overlap: each one starts from the snapshot the previous run pushed.
concurrency:
  group: signal-snapshots
  cancel-in-progress: false

jobs:
  update-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write  # Required to push signal_history/ back to repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Important: fetch full history so we can push back
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run headless update script
      env:
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SCHEDULE: ${{ github.event.schedule }}
        INPUT_GROUP: ${{ inputs.group }}
      run: |
        case "$SCHEDULE" in
          "0 8 * * *")   GROUP=asia ;;
          "30 17 * * *") GROUP=europe ;;
          "30 21 * * *") GROUP=america-1 ;;
          "30 22 * * *") GROUP=america-2 ;;
          *)             GROUP="${INPUT_GROUP:-all}" ;;
        esac
        echo "Gruppe: $GROUP"
        echo "GROUP=$GROUP" >> "$GITHUB_ENV"
        python update_signals.py --group "$GROUP"

    - name: Run paper bot (after the last group of the day)
      if: env.GROUP == 'america-2' || inputs.run_bot
      continue-on-error: true  # a bot problem must never block saving the snapshot
      run: python paper_bot.py run

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git add -A signal_history/ bot_depot/
        git status
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update signal snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
        else
          echo "No changes to commit"
        fi
