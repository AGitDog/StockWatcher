name: Update Stock Signals

on:
  schedule:
    # Run once every 24 hours at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  update-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write  # Required to push signal_history/ back to repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Important: fetch full history so we can push back
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run headless update script
      env:
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: python update_signals.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git add -A signal_history/
        git status
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update signal snapshots"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ $pushed -eq 0 ]; then
            echo "ERROR: Failed to push changes after 3 attempts!"
            exit 1
          fi
        else
          echo "No changes to commit"
        fi
