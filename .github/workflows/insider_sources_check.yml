name: Check Insider Sources

# Weekly live check of every insider data source (SIX, AMF, AFM, Yahoo, Finnhub, FX rates) and of
# the insider coverage in the latest snapshot. A broken source fails the run, so GitHub mails the
# repository owner before the Rang-Score silently loses its insider data. Read-only: no commits.
on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC, between the nightly chains
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Unit tests of the insider parsers
      run: python -m pytest tests/test_insider_sources.py tests/test_insider_check.py -q

    - name: Live check of every source
      env:
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      run: python insider_check.py
